name: Publish AbsoluteZero Windows test build

on:
  push:
    branches: [downloads/absolutezero-beta-5]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'asblPixels/asblPixels'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified binary
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS-windows-x64
          tag=absolutezero-v0.1.1-beta.5
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$tag" AbsoluteZero-0.1.1-beta.5-windows-x64.exe SHA256SUMS-windows-x64
            gh release edit "$tag" --target "$GITHUB_SHA" --draft=false
          fi
